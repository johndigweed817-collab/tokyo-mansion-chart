<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日本史絵巻 — 歴史に学ぶ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top">
  <div class="brand">
    <h1>日本史絵巻</h1>
    <p class="tag">歴史を学ぶのは、歴史に学ぶため</p>
  </div>
  <div id="now" aria-live="polite"><b></b><span></span></div>
  <div class="ctrl">
    <div id="zbar" title="拡大率"><i></i></div>
    <span id="zlabel">×1.0</span>
    <button id="zout" type="button" aria-label="縮小">－</button>
    <button id="zin" type="button" aria-label="拡大">＋</button>
    <button id="zfit" type="button" aria-label="全体表示">全体</button>
  </div>
</header>

<main id="scroll">
  <div id="ribbon" aria-label="時代"></div>

  <div id="view" data-lod="s">
    <div id="bands"></div>
    <div id="mists"></div>
    <div class="ground"></div>
    <div id="events"></div>
    <div id="legend"></div>
    <div id="hint">ホイール／ピンチで拡大縮小 ・ ドラッグで移動 ・ ダブルタップで拡大 ・ 札をタップで詳細へ</div>

    <div id="fallback" hidden>
      <p><b>data.json を読み込めませんでした。</b></p>
      <p>ローカルでは <code>python3 -m http.server</code> で配信するか、下のボタンで data.json を選択してください。<br>S3 / CloudFront などで配信する場合はそのまま動きます。</p>
      <input type="file" id="fbfile" accept=".json,application/json">
    </div>
  </div>

  <canvas id="ruler"></canvas>
  <i class="roller l"></i><i class="roller r"></i>
</main>

<footer>
  <canvas id="mini" aria-label="全体ミニマップ"></canvas>
</footer>

<script src="app.js"></script>
</body>
</html>
