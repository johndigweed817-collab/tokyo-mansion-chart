<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>宇宙史絵巻 — 宇宙の誕生から未来へ</title>
<meta name="description" content="宇宙の誕生から、地球と生命、ホモ・サピエンス、宇宙を理解する学説の歩み、そして未来へ。拡大縮小できる横スクロールの宇宙年表。">
<meta property="og:type" content="website">
<meta property="og:title" content="宇宙史絵巻 — 宇宙の誕生から未来へ">
<meta property="og:description" content="宇宙の誕生から未来まで、138億年を一本の絵巻で。地球・生命・人類・相対性理論やホログラフィック原理までをたどる。">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://yousideme.vercel.app/uchushi-emaki/">
<meta property="og:image" content="https://yousideme.vercel.app/uchushi-emaki/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://yousideme.vercel.app/uchushi-emaki/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../nihonshi-emaki/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="../nihonshi-emaki/favicon.ico" sizes="48x48">
<link rel="icon" href="../nihonshi-emaki/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../nihonshi-emaki/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2a211b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宇宙史絵巻">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../nihonshi-emaki/intro.css">
</head>
<body>

<header id="top">
  <div class="brand">
    <h1>宇宙史絵巻</h1>
    <p class="tag">歴史を学ぶのは、歴史に学ぶため</p>
  </div>
  <div id="now" aria-live="polite"><b></b><span></span></div>
  <div class="ctrl">
    <button id="eraintro" type="button" title="いまの時代の解説">時代解説</button>
    <div id="zbar" title="拡大率"><i></i></div>
    <span id="zlabel">×1.0</span>
    <button id="zout" type="button" aria-label="縮小">－</button>
    <button id="zin" type="button" aria-label="拡大">＋</button>
    <button id="zfit" type="button" aria-label="全体表示">全体</button>
    <a class="wl" href="../nihonshi-emaki/" title="日本史絵巻へ">日本史 →</a>
  </div>
</header>

<main id="scroll">
  <div id="ribbon" aria-label="時代"></div>

  <div id="view" data-lod="s">
    <div id="bands"></div>
    <div id="mists"></div>
    <div class="ground"></div>
    <div id="span" hidden><i class="sl"></i><i class="sr"></i><em class="y1"></em><em class="y2"></em></div>
    <div id="events"></div>
    <div id="people"></div>
    <div id="legend"></div>
    <aside id="panel" hidden>
      <button type="button" id="pclose" aria-label="閉じる">×</button>
      <div id="pbody"></div>
    </aside>
    <div id="hint">ホイール／ピンチで拡大縮小 ・ ドラッグで移動 ・ 札・人物をタップで詳細へ ・ ※時間軸は時代ごとに圧縮しています</div>

    <div id="fallback" hidden>
      <p><b>data.json を読み込めませんでした。</b></p>
      <p>ローカルでは <code>python3 -m http.server</code> で配信するか、下のボタンで data.json を選択してください。<br>S3 / CloudFront などで配信する場合はそのまま動きます。</p>
      <input type="file" id="fbfile" accept=".json,application/json">
    </div>
  </div>

  <canvas id="ruler"></canvas>
  <i class="roller l"></i><i class="roller r"></i>
</main>

<footer>
  <canvas id="mini" aria-label="全体ミニマップ"></canvas>
</footer>

<script src="../nihonshi-emaki/face.js"></script>
<script src="../nihonshi-emaki/intro.js"></script>
<script src="app.js"></script>
</body>
</html>
