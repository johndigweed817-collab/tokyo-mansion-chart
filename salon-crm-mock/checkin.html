<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チェックイン用キオスク端末 | 常連客づくりCRM モック</title>
<style>
  :root {
    --espresso: #2A211C;
    --espresso2: #4A3B30;
    --gold: #D4AF37;
    --cream: #F3ECE2;
    --muted: #8A7C6E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; background: #EFE9E1; }
  a { color: var(--gold); }
  a:hover { color: #E8C766; }

  .page-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 0; }
  .back-link { font-size: 12px; color: var(--espresso); opacity: .7; }
  .back-link:hover { opacity: 1; }

  .kiosk {
    width: 760px; max-width: 94vw; height: 1100px; max-height: 92vh;
    background: linear-gradient(160deg, var(--espresso), var(--espresso2));
    border-radius: 26px;
    display: flex; flex-direction: column;
    padding: 34px 34px 26px;
    overflow: hidden;
  }
  .kiosk-top { text-align: center; margin-bottom: 22px; }
  .kiosk-brand { font-size: 15px; letter-spacing: 3px; color: var(--gold); font-weight: 800; }
  .kiosk-sub { font-size: 12.5px; color: #C9BEB2; margin-top: 6px; }

  .cam-wrap {
    flex: 1; position: relative; border-radius: 26px; overflow: hidden;
    background: #0B0B0B; cursor: pointer;
  }
  .cam-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam-fallback {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: linear-gradient(160deg, #3A2E26, #17110D); color: var(--cream); text-align: center; padding: 0 50px;
  }
  .cam-fallback svg { width: 56px; height: 56px; color: var(--muted); }
  .cam-fallback-text { font-size: 14px; line-height: 1.6; color: #D9CFC4; }
  .cam-fallback-sub { font-size: 12px; color: var(--gold); font-weight: 700; }

  .scan-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .scan-frame-box { position: relative; width: 280px; height: 280px; }
  .corner { position: absolute; width: 36px; height: 36px; border-color: var(--gold); }
  .corner.tl { top: 0; left: 0; border-top: 5px solid; border-left: 5px solid; border-radius: 10px 0 0 0; }
  .corner.tr { top: 0; right: 0; border-top: 5px solid; border-right: 5px solid; border-radius: 0 10px 0 0; }
  .corner.bl { bottom: 0; left: 0; border-bottom: 5px solid; border-left: 5px solid; border-radius: 0 0 0 10px; }
  .corner.br { bottom: 0; right: 0; border-bottom: 5px solid; border-right: 5px solid; border-radius: 0 0 10px 0; }
  @keyframes kiosk-pulse {
    0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.55); }
    70% { box-shadow: 0 0 0 26px rgba(212,175,55,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
  .scan-overlay.pulsing .scan-frame-box { border-radius: 24px; animation: kiosk-pulse 1.3s ease-out infinite; }

  .success-flash {
    position: absolute; inset: 0; background: rgba(42,33,28,0.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--cream);
  }
  .success-ic { width: 74px; height: 74px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; color: var(--espresso); }
  .success-name { font-size: 22px; font-weight: 800; color: #FFFFFF; }
  .success-sub { font-size: 13.5px; color: #D9CFC4; }

  .kiosk-status { text-align: center; padding: 20px 10px 6px; font-size: 16px; font-weight: 700; color: var(--cream); }
  .kiosk-foot { text-align: center; font-size: 10.5px; color: #8A7C6E; line-height: 1.6; padding: 8px 30px 0; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="kiosk">
    <div class="kiosk-top">
      <div class="kiosk-brand">HAIR SALON TOKI</div>
      <div class="kiosk-sub">セルフチェックイン端末(入口設置イメージ)</div>
    </div>

    <div class="cam-wrap" id="cam-wrap">
      <video id="kiosk-video" autoplay muted playsinline></video>
      <div class="cam-fallback" id="cam-fallback" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M21 16.5V8a2 2 0 0 0-2-2h-3.5l-1-1.5h-5L8.5 6H5a2 2 0 0 0-1.4.6"></path><path d="M3 8v10a2 2 0 0 0 2 2h12"></path><circle cx="12" cy="13" r="3.2"></circle></svg>
        <div class="cam-fallback-text" id="cam-fallback-text"></div>
        <div class="cam-fallback-sub">タップしてチェックインの流れを体験できます</div>
      </div>
      <div class="scan-overlay" id="scan-overlay">
        <div class="scan-frame-box">
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        </div>
      </div>
      <div class="success-flash" id="success-flash" style="display:none">
        <div class="success-ic"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"></path></svg></div>
        <div class="success-name" id="success-name"></div>
        <div class="success-sub">チェックインが完了しました</div>
      </div>
    </div>

    <div class="kiosk-status" id="kiosk-status">QRコードを画面にかざしてください</div>
    <div class="kiosk-foot">この画面は入口設置のタブレット等での常設利用を想定したイメージです。実機のカメラ映像を表示しようとします(ブラウザやOSの設定で映らない場合はシミュレーション表示になります)。画面をタップするとチェックインの流れを確認できます。</div>
  </div>
  <a class="back-link" href="index.html">&larr; モック一覧に戻る</a>
</div>

<script>
(function () {
  var NAMES = ['佐藤 花子 様', '田中 由美 様', '鈴木 蓮 様'];
  var status = 'idle'; // idle | scanning | success
  var cycleIndex = -1;
  var stream = null;
  var scanTimeout = null;
  var resetTimeout = null;

  function setStatus(next) {
    status = next;
    document.getElementById('scan-overlay').classList.toggle('pulsing', status === 'scanning');
    document.getElementById('success-flash').style.display = status === 'success' ? 'flex' : 'none';
    var label = status === 'scanning' ? 'スキャン中です・・・' : status === 'success' ? 'ありがとうございました' : 'QRコードを画面にかざしてください';
    document.getElementById('kiosk-status').textContent = label;
  }

  function showCameraError(msg) {
    document.getElementById('cam-fallback').style.display = 'flex';
    document.getElementById('cam-fallback-text').textContent = msg;
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCameraError('このブラウザではカメラを利用できません');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (s) {
      stream = s;
      var v = document.getElementById('kiosk-video');
      v.srcObject = s;
      if (v.play) v.play().catch(function () {});
    }).catch(function () {
      showCameraError('カメラにアクセスできませんでした(ブラウザの権限設定をご確認ください)');
    });
  }

  function handleTap() {
    if (status === 'scanning' || status === 'success') return;
    clearTimeout(scanTimeout);
    clearTimeout(resetTimeout);
    setStatus('scanning');
    var nextIndex = (cycleIndex + 1) % NAMES.length;
    scanTimeout = setTimeout(function () {
      cycleIndex = nextIndex;
      document.getElementById('success-name').textContent = NAMES[nextIndex];
      setStatus('success');
      resetTimeout = setTimeout(function () { setStatus('idle'); }, 3000);
    }, 1300);
  }

  document.getElementById('cam-wrap').addEventListener('click', handleTap);
  window.addEventListener('beforeunload', function () {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    clearTimeout(scanTimeout);
    clearTimeout(resetTimeout);
  });

  startCamera();
  setStatus('idle');
})();
</script>
</body>
</html>
